<!DOCTYPE html>
<html>

<head>

    <!-- =========================
         PAGE TITLE
    ========================== -->

    <title>Login</title>

    <!-- External CSS -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =========================
         LOGIN CONTAINER
    ========================== -->

    <div class="form-container">

        <h2>Login</h2>

        <!-- =========================
             LOGIN FORM
        ========================== -->

        <form id="loginForm">

            <input
                type="text"
                id="loginUsername"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <!-- =========================
             LOGIN MESSAGE
        ========================== -->

        <p id="loginMessage"></p>

        <!-- =========================
             LINKS
        ========================== -->

        <div class="links">

            <a href="forgotpassword.html">
                Forgot Password
            </a>

            <br>

            <a href="registration.html">
                Create New Account
            </a>

        </div>

    </div>

    <!-- External JavaScript -->

    <script src="login.js"></script>

</body>

</html>
